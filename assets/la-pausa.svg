<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 900 920" fill="none">
<title>La pausa, una ilustración original</title><desc>Una mujer adulta de cabello oscuro recogido descansa las manos alrededor de una taza. Está sentada a una mesa de madera junto a una ventana abierta al verde. Hay un teléfono boca arriba, un libro, una rama de olivo y un paño doblado. Su mirada baja y sus hombros relajados hablan de una tarde larga.</desc>
